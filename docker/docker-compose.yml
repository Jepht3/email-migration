# Serveur IMAP de test (alternative à scripts/test-integration.ps1 sur un poste avec Docker / en CI).
#   docker compose -f docker/docker-compose.yml up -d
#   MAILMIGRATOR_GREENMAIL=127.0.0.1:3143 dotnet test --filter Category=Integration
# Les boîtes source@test.local et destination@test.local sont remplies par les tests eux-mêmes.
services:
  greenmail:
    image: greenmail/standalone:2.1.14
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.imap
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=source:source@test.local,destination:destination@test.local
        -Dgreenmail.users.login=email
    ports:
      - "3143:3143"
