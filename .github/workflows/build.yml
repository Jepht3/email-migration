# Compilation, tests et installeur à chaque push ; Release GitHub pour chaque tag « v* ».
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilation, tests et installeur
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Configuration OAuth du client Windows
        shell: powershell
        env:
          GOOGLE_DESKTOP_CLIENT_JSON: ${{ secrets.GOOGLE_DESKTOP_CLIENT_JSON }}
        run: |
          if ($env:GOOGLE_DESKTOP_CLIENT_JSON) {
            [IO.File]::WriteAllText((Join-Path $pwd 'src/MailMigrator.App/google-desktop-client.json'), $env:GOOGLE_DESKTOP_CLIENT_JSON)
          } elseif ('${{ github.ref }}'.StartsWith('refs/tags/')) {
            throw 'Configuration OAuth Google absente : distribution interrompue.'
          }

      - name: Compilation
        run: dotnet build MailMigrator.sln -c Release

      - name: Tests unitaires
        run: dotnet test tests/MailMigrator.Tests -c Release --no-build --logger "trx;LogFileName=unitaires.trx"

      - name: Tests d'intégration (serveur IMAP GreenMail)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\test-integration.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Installation d'Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Installeur
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\build-installer.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Résultats des tests
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: resultats-tests
          path: tests/MailMigrator.Tests/TestResults/*.trx
          if-no-files-found: ignore

      - name: Installeur (téléchargeable depuis l'onglet Actions)
        uses: actions/upload-artifact@v5
        with:
          name: installeur
          path: installer/Output/*.exe

      - name: Release GitHub (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
          generate_release_notes: true

  android:
    name: Application Android (APK)
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: "17"

      - name: Charge de travail MAUI Android
        run: dotnet workload install maui-android

      - name: Clé de signature (secret du dépôt, facultatif)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lewebmax.keystore"
          echo "ANDROID_KEYSTORE=$RUNNER_TEMP/lewebmax.keystore" >> "$GITHUB_ENV"

      - name: APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          dotnet publish src/MailMigrator.Mobile/MailMigrator.Mobile.csproj -c Release -f net10.0-android -o out
          version=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props)
          cp out/*-Signed.apk "LEWEBMAX-MailMigrator-$version.apk"

      - uses: actions/upload-artifact@v5
        with:
          name: apk-android
          path: "*.apk"

      - name: Release GitHub (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.apk"
